spring.application.name=aryavart-dairy-backend
server.port=${SERVER_PORT:8080}

# ---------- MongoDB (values backend/.env se aati hain) ----------
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017}
spring.data.mongodb.database=${MONGODB_DATABASE:ARYA_DB}
spring.data.mongodb.auto-index-creation=true

# ---------- JWT ----------
app.jwt.secret=${JWT_SECRET_KEY:local-dev-only-secret-change-me-0123456789abcdef}
app.jwt.expiry-days=${JWT_EXPIRY_DAYS:7}

# ---------- Super Admin (startup par .env se seed/sync hota hai) ----------
app.seed.super-admin-id=${SUPER_ADMIN_ID:aryavart_admin}
app.seed.super-admin-pass=${SUPER_ADMIN_PASS:Admin@123}

# ---------- CORS ----------
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
